name: Update Recent Activity

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Blog, activity and track-record workflows all rewrite README.md. One shared
# group makes them run one at a time, so a lost push race cannot skip an update.
concurrency:
  group: readme-writes
  cancel-in-progress: false

jobs:
  update-readme-with-activity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jamesgeorge007/github-activity-readme@4aefbfa1c222d70537dc6a02f0519266aab2b1ea # v0.5.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
