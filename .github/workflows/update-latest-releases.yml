name: Update Latest Releases

on:
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

# One README writer at a time: the blog, activity and track-record workflows share this group.
concurrency:
  group: readme-writes
  cancel-in-progress: false

jobs:
  update-latest-releases:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Exit 3 means the README was written but some rows or counts could not be refreshed:
      # the job turns red (so the owner is told) and the next step still commits the rest.
      - name: Update the releases table and commit counts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_latest_releases.py README.md

      - name: Commit changes
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: auto-update latest releases and commit counts"
          git pull --rebase
          git push
