name: Update Track Record

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

# Blog, activity and track-record workflows all rewrite README.md. One shared
# group makes them run one at a time, so a lost push race cannot skip an update.
concurrency:
  group: readme-writes
  cancel-in-progress: false

jobs:
  update-track-record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Update Track Record numbers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_track_record.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: auto-update Track Record stats"
          # A person (or another bot) may have pushed since checkout; replay on top.
          git pull --rebase
          git push
