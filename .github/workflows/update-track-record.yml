name: Update Track Record

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

# Blog, activity and track-record workflows all rewrite README.md. One shared
# group runs them one at a time, so they no longer race each other's push. GitHub
# keeps at most one waiting run per group (a newer one replaces an older one); a
# replaced run is simply redone on its next schedule.
concurrency:
  group: readme-writes
  cancel-in-progress: false

jobs:
  update-track-record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Update Track Record numbers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_track_record.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: auto-update Track Record stats"
          # A person (or another bot) may have pushed since checkout; replay on top.
          git pull --rebase
          git push
