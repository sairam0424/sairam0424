name: Latest blog post workflow

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Blog, activity and track-record workflows all rewrite README.md. One shared
# group runs them one at a time, so they no longer race each other's push. GitHub
# keeps at most one waiting run per group (a newer one replaces an older one); a
# replaced run is simply redone on its next schedule.
concurrency:
  group: readme-writes
  cancel-in-progress: false

jobs:
  update-readme-with-blog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: gautamkrishnar/blog-post-workflow@f177491c77670f150ab4e9b9890254d8eba4164b # v1
        with:
          # The Substack feed is not listed: it answers HTTP 403 to GitHub-hosted
          # runners (every run since 2026-09-28) and its posts are cross-posted to dev.to.
          feed_list: "https://dev.to/feed/sai_ram_0000,https://medium.com/feed/@uggesairam0000,https://sairam0000.hashnode.dev/rss.xml"
          max_post_count: "5"
